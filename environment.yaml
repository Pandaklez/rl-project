# environment.yaml — the `smplerx` conda environment, which runs training,
# evaluation and every SMPL-X forward pass in this repo.
#
#     conda env create -f environment.yaml
#     conda activate smplerx
#
# Exported from the working environment with `conda env export --no-builds`, so
# versions are pinned but builds are not. Python 3.8 / torch 1.13.1 / CUDA 11.7
# are load-bearing: mmcv-full 1.7.1 and mmdet 2.26.0 are compiled against that
# combination and will not work against a newer torch.
#
# THREE THINGS THIS FILE CANNOT CAPTURE
#
# 1. `mmpose` 0.28.0 is an *editable* install pointing at
#    smpler-x-main/transformer_utils (the vendored SMPLer-X fork), and
#    `conda env export` silently omits editable installs. Nothing under `src/`
#    imports it — only `scripts/extract_2d.py` uses the mm* stack, and it uses
#    `mmdet` for detection while implementing ViTPose directly in PyTorch,
#    precisely because the fork's detector module does `from config import cfg`
#    and fails to import. Restore it only if you need the SMPLer-X inference
#    path:
#
#        pip install -e smpler-x-main/transformer_utils
#
# 2. Model and data files. The SMPL-X body models (SMPLX_NEUTRAL.pkl etc.),
#    vitpose_base.pth, the mmdet checkpoint, and everything under data/ are not
#    Python packages. See README.md.
#
# 3. `pytest` is deliberately absent, matching the working environment. Most
#    tests run in the base env; the ones needing smplx or gymnasium are skipped
#    there. To run the full suite here: `pip install pytest`.
#
# KNOWN FRICTION POINT
#
# `mmcv-full==1.7.1` in the pip section builds from source on PyPI, which needs
# nvcc and takes a long time. Install it from the OpenMMLab wheel index instead,
# matching the torch/CUDA pins above:
#
#     pip install mmcv-full==1.7.1 \
#       -f https://download.openmmlab.com/mmcv/dist/cu117/torch1.13/index.html
#
# The conda half of this file has been verified to solve
# (`conda env create --dry-run`); the pip half has not, since a dry run does not
# resolve pip.

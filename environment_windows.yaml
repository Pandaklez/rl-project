# environment_windows.yaml — the `rl_project` conda environment: the Windows
# counterpart of `environment.yaml` (the `smplerx` env, exported from a Linux
# CUDA 11.7 machine). Covers everything under `src/` and `tests/` — training,
# the GAIL discriminator, evaluation, forward kinematics, the test suite.
#
#     conda env create -f environment_windows.yaml
#     conda activate rl_project
#
# Exported from the working environment with `conda env export --no-builds`,
# so versions are pinned but builds are not (builds are OS/compiler-specific
# and would make this file fail to solve on a different Windows machine for no
# real reason).
#
# WHY THIS FILE EXISTS SEPARATELY FROM environment.yaml
#
# `environment.yaml` pins Python 3.8 / torch 1.13.1 / CUDA 11.7 because
# mmcv-full 1.7.1 and mmdet 2.26.0 are compiled against that exact
# combination — see its header. Nothing under `src/` or `tests/` needs the
# mm* stack (only `scripts/extract_2d.py` does, for the SMPLer-X ViTPose
# inference path), so this env carries none of it and is free to run
# Python 3.10 / torch 2.11 / CUDA 13 instead. **Do not try to make the two
# files agree on Python/torch/CUDA** — they are pinned for different, disjoint
# reasons, and this one has been verified against this repo's actual code, not
# derived from the other by translation:
#
#   - `python -m pytest tests/` — 77 passed, 8 skipped (skips need
#     data/reproj_targets.h5, not a package problem)
#   - A real `python -m src.gail_train` run (env + skrl PPO + the GAIL
#     discriminator + checkpointing + TensorBoard) to completion.
#
# THINGS THIS FILE CANNOT CAPTURE (mirrors environment.yaml's three points)
#
# 1. Nothing is installed here for `scripts/extract_2d.py`'s mm* stack
#    (mmcv-full, mmdet, mmengine, mmpose / the editable
#    `smpler-x-main/transformer_utils` install). It was skipped deliberately,
#    not overlooked: mmcv-full 1.7.1 needs compiling against torch 1.13.1 +
#    CUDA 11.7 specifically, which is a different, incompatible fight from the
#    torch 2.11 / CUDA 13 stack the rest of this file pins. If you need that
#    inference path, it belongs in its own environment (or in `smplerx` on a
#    Linux box), not bolted onto this one.
#
# 2. Model and data files. The SMPL-X body models (SMPLX_NEUTRAL.npz etc.,
#    expected at common/utils/human_model_files/smplx/), the mmdet/vitpose
#    checkpoints (only if you do set up #1), and everything under data/ are
#    not Python packages. See README.md.
#
# 3. Unlike environment.yaml, `pytest` IS included below — it was missing
#    from the env this file was exported from, and got installed as part of
#    getting this environment working, so `conda env export` picked it up
#    for free.
#
# HONESTLY: THIS ENV HAS CLUTTER
#
# `rl_project` started as a copy of an unrelated general-purpose/Jupyter
# environment, not one built for this repo, and the export below reflects
# that — jupyter*, ipykernel, ipywidgets, PyQt6, pandas, decord and friends
# are all in here and none of them are used by anything under `src/` or
# `tests/` (checked by grepping every import). They're harmless to keep — a
# fresh, minimal env would work exactly as well — but don't read their
# presence below as this project depending on Jupyter or Qt.
